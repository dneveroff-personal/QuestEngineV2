# Quest Engine V2 (registry image)
# Deploy: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# Публичный вход — только frontend/nginx (порт 80). app доступен только внутри docker-сети.
services:

  postgres:
    image: postgres:16-alpine
    container_name: qe-v2-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-qe_v2_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qe_v2_db_data:/var/lib/postgresql/data
    networks:
      - qe-v2-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  app:
    image: ghcr.io/dneveroff-personal/questenginev2:${VERSION}
    container_name: qe-v2-app
    # Порт НЕ публикуется на хост намеренно — единственная публичная точка
    # входа теперь frontend/nginx (см. ниже и docs/08-ops/deployment.md).
    # app доступен другим сервисам сети только как app:8080.
    expose:
      - "8080"
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_RESET_SECRET: ${ADMIN_RESET_SECRET}
    networks:
      - qe-v2-network
    restart: unless-stopped

  # Единственная публично открытая точка входа — см. docs/08-ops/deployment.md.
  # app:8080 сознательно не публикуется наружу напрямую в проде — весь
  # внешний трафик (и статика, и /api, и /auth) идёт через nginx, это и
  # обеспечивает same-origin без CORS (threat-model.md).
  frontend:
    image: ghcr.io/dneveroff-personal/questenginev2-frontend:${FRONTEND_VERSION:-latest}
    container_name: qe-v2-frontend
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - qe-v2-network
    restart: unless-stopped

# ======================
# Volumes
# ======================
volumes:
  qe_v2_db_data:

# ======================
# Networks
# ======================
networks:
  qe-v2-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
