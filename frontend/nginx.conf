server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip для статики — заметно на JS-бандле SPA
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API backend. Важно: auth-эндпоинты живут под /auth, а не под /api
    # (см. backend Routes.java — AUTH = "/auth", отдельно от API = "/api").
    # "app" — имя сервиса backend в docker-compose, резолвится через
    # Docker DNS внутри общей сети.
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://app:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE-статистика (ADR-0014) — буферизация должна быть выключена,
    # иначе события будут приходить пачками, а не немедленно, как решено
    # в ADR-0014 ("без искусственной задержки/батчинга").
    location /api/statistics/ {
        proxy_pass http://app:8080/api/statistics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # SPA fallback: любой не-API маршрут (например /quests/42/play при
    # прямом заходе или обновлении страницы) отдаёт index.html, роутинг
    # дальше берёт на себя React Router.
    location / {
        try_files $uri /index.html;
    }

    # Статические ассеты со стабильными именами (Vite добавляет hash в
    # имя файла) — можно кэшировать агрессивно и безопасно.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
