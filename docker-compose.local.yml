# Quest Engine V2 (host-build)
# Workflow: ./gradlew clean build -x test → docker compose -f docker-compose.local.yml up -d --build
# Frontend собирается тем же up --build (frontend/Dockerfile — Node build + nginx serve).
# Открыть приложение: http://localhost:8081 (не 5173 — это порт `npm run dev`, не контейнера)
services:

  postgres:
    image: postgres:16-alpine
    container_name: qe-v2-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-qe_v2_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qe_v2_db_data:/var/lib/postgresql/data
    networks:
      - qe-v2-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qe-v2-app
    ports:
      - "8080:8080"
      - "5004:5004"   # Debug port
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_RESET_SECRET: ${ADMIN_RESET_SECRET}
    networks:
      - qe-v2-network
    restart: unless-stopped

  # Frontend отдаётся через nginx: статика + reverse proxy /api и /auth
  # на app (docs/08-ops/deployment.md). Локально собирается из исходников
  # — для прода см. docker-compose.prod.yml (готовый образ из registry).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qe-v2-frontend
    ports:
      - "8081:80"
    depends_on:
      - app
    networks:
      - qe-v2-network
    restart: unless-stopped

# ======================
# Volumes
# ======================
volumes:
  qe_v2_db_data:

# ======================
# Networks
# ======================
networks:
  qe-v2-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
