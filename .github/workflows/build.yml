name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # Определяет, какая часть монорепозитория менялась — чтобы коммит,
  # трогающий только backend, не пересобирал и не публиковал новый образ
  # frontend без необходимости, и наоборот.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'build.gradle.kts'
              - 'Dockerfile'
            frontend:
              - 'frontend/**'

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Загрузка энвайрмента
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Проверка ошибок
      - name: Run code style check
        run: ./gradlew spotlessCheck

      # Сборка
      - name: Build
        run: ./gradlew clean build

      # Docker BuildX
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Публикация package в Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "VERSION=$(./gradlew properties --console=plain | grep "^version:" | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Set lowercase repository name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Публикации версии и latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.REPO_LOWER }}:latest

      ## Создание Артефактов
      # Артефакт: создание jar файла
      - name: Upload application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar

      # Артефакт: степень покрытия тестами
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

      # Артефакт: отчет по тестам
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # --passWithNoTests: временно, пока не написан первый тест
      # (docs/frontend/testing-strategy.md). Убрать флаг, когда появятся
      # первые component-тесты — тогда отсутствие тестов должно ронять сборку.
      - name: Test
        run: npm run test -- --run --passWithNoTests

      - name: Type-check & build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Set lowercase repository name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.REPO_LOWER }}-frontend:latest
